<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="abapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="abapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Bright White / Light Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" filter="url(#abapShadow)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#abapGrad)" stroke-width="2.5"/>

  <!-- Iconic ABAP / Code Brackets < / > -->
  <path d="M 19 26 L 11 34 L 19 42" fill="none" stroke="url(#abapGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 37 26 L 45 34 L 37 42" fill="none" stroke="url(#abapGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="31" y1="24" x2="25" y2="44" stroke="url(#abapGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Luminous Green Accent Dot -->
  <circle cx="48" cy="18" r="3.5" fill="#10b981"/>
</svg>
